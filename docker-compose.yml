services:
  mongodb:
    image: mongo:6.0
    container_name: sms_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sms_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/school_mgmt
      - JWT_SECRET=supersecretjwtkey12345!
      - CLIENT_URL=http://localhost:5173,http://localhost:5174,http://localhost:5175
      - RESEND_API_KEY=
      - EMAIL_FROM=onboarding@resend.dev
      - CLOUDINARY_CLOUD_NAME=
      - CLOUDINARY_API_KEY=
      - CLOUDINARY_API_SECRET=
    depends_on:
      - mongodb
    networks:
      - sms_network

  frontend_schoolweb:
    build:
      context: ./frontend_school_web
      dockerfile: Dockerfile
      target: development
    container_name: sms_frontend_schoolweb
    ports:
      - "5173:5173"
    volumes:
      - ./frontend_school_web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - sms_network

  frontend_mgmt:
    build:
      context: ./frontend_mgmt
      dockerfile: Dockerfile
      target: development
    container_name: sms_frontend_mgmt
    ports:
      - "5174:5173"
    volumes:
      - ./frontend_mgmt:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - sms_network

  frontend_attedence:
    build:
      context: ./frontend_attedence
      dockerfile: Dockerfile
      target: development
    container_name: sms_frontend_attedence
    ports:
      - "5175:5173"
    volumes:
      - ./frontend_attedence:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - sms_network

volumes:
  mongodb_data:

networks:
  sms_network:
    driver: bridge
