name: School Management System CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Jest Tests
        run: |
          cd backend
          npm test

  test-frontends:
    name: Test Frontend - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend_mgmt, frontend_attedence]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.project }}/package-lock.json'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.project }}
          npm ci

      - name: Run Vitest Tests
        run: |
          cd ${{ matrix.project }}
          npm run test

  build-docker:
    name: Validate Docker Build - ${{ matrix.service }}
    needs: [test-backend, test-frontends]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend_schoolWeb, frontend_mgmt, frontend_attedence]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:latest
