services:
  # -------------------------------------------------------------
  # 1. BACKEND DOCKER SERVICE (Express + Mongoose + Socket.io)
  # -------------------------------------------------------------
  - type: web
    name: school-mgmt-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: backend
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # MongoDB Atlas URI: mongodb+srv://user:pass@cluster.mongodb.net/school_mgmt
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # Render Frontends URLs (comma separated)
      - key: BREVO_API_KEY
        sync: false # Get free API Key at https://app.brevo.com/settings/keys/api
      - key: EMAIL_FROM
        sync: false # Brevo registered sender email (e.g. your_email@gmail.com)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # -------------------------------------------------------------
  # 2. PUBLIC WEBSITE FRONTEND (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: school-mgmt-schoolweb
    env: static
    rootDir: frontend_school_web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA Rewrite Rule for React Router (prevents 404 on refresh)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Render Backend URL

  # -------------------------------------------------------------
  # 3. MANAGEMENT PORTAL FRONTEND (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: school-mgmt-admin
    env: static
    rootDir: frontend_mgmt
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA Rewrite Rule for React Router (prevents 404 on refresh)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Render Backend URL

  # -------------------------------------------------------------
  # 4. ATTENDANCE KIOSK FRONTEND (React + Vite SPA)
  # -------------------------------------------------------------
  - type: web
    name: school-mgmt-attendance
    env: static
    rootDir: frontend_attedence
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA Rewrite Rule for React Router (prevents 404 on refresh)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Render Backend URL
